<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Nuevo Cliente</title>
</head>
<body>
<form action="/clients" method="post">
    <fieldset>
        <legend>Información Personal</legend>

        <div>
            <label for="name">name:</label>
            <input type="text" id="name" name="name" placeholder="Escribe tu name" required>
        </div>

        <div>
            <label for="surname">surname:</label>
            <input type="text" id="surname" name="surname" placeholder="Escribe tus surname" >
        </div>

        <div>
            <label for="email">Correo Electrónico:</label>
            <input type="email" id="email" name="email" placeholder="ejemplo@correo.com" required>
        </div>

        <div>
            <label for="age">Edad</label>
            <input type="number" min="16" id="age" name="age" >
        </div>

        <div>
            <label for="phone">Teléfono (Opcional):</label>
            <input type="tel" id="phone" name="phone" placeholder="+34 600 000 000">
        </div>
    </fieldset>

    <button id="btnPost">Crear Usuario</button>


</form>

<pre id="respuestaPost">...</pre>

<script>
    // --- Script para el POST ---
 document.getElementById('btnPost').addEventListener('click', async () => {
     const output = document.getElementById('respuestaPost');
     const name= document.getElementById('name').value;
          const surname= document.getElementById('surname').value;
     const email= document.getElementById('email').value;
     const age= document.getElementById('age').value;
     const phone= document.getElementById('phone').value;

     output.textContent = 'Enviando...';

     try {
         const response = await fetch('/clients', {
             method: 'POST',
             headers: {
                 'Content-Type': 'application/json',
             },
             body: JSON.stringify({ 
                "name": name.value,
                "surname": surname.value,
                "email": email.value,
                "age": age.value,
                "phone": phone.value
              })
              
               // El objeto que espera tu API
         })
         .then(response => response.json())
.then(data => console.log('Éxito:', data))
.catch(error => console.error('Error:', error));
         
         if (!response.ok) throw new Error('Error: ' + response.status);
         const data = await response.json();
         output.textContent = JSON.stringify(data, null, 2);
     } catch (error) {
         output.textContent = error.message;
     }
 });
</script>
</body>
</html>
</html>
